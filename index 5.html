<style>
/* page reset */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* layout: full-bleed 3D harbour alley at dusk; HUD pinned top, actions + 차림표 sheet at bottom */
:root{
  --bg:#141019;
  --paper:#f3e9dc;
  --paper-dim:#cdbfad;
  --on-paper:#2a1d18;
  --panel:rgba(30,23,22,.82);
  --panel-solid:#211917;
  --line:rgba(243,233,220,.16);
  --brick:#b04a2f;
  --brick-hi:#e07a52;
  --shade:rgba(12,9,13,.62);
  --dc-bg:rgba(243,233,220,.06);
  --display:"Song Myung","Nanum Myeongjo","AppleMyungjo",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}

#top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.place{min-width:0;max-width:62vw;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.top-btns{display:flex;gap:8px;flex:none;pointer-events:auto}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
#volBox{pointer-events:auto;display:flex;flex-direction:column;align-items:stretch;gap:8px;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--paper);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#volBox[hidden]{display:none}
#people{margin-top:0}
#volBox label{display:flex;align-items:center;justify-content:space-between;gap:10px}
#volAmb{width:120px;accent-color:var(--brick-hi)}
#soundOff{font-family:var(--body);font-size:13px;color:var(--paper-dim);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}
#sound{width:38px;height:38px;padding:0!important;display:grid;place-items:center}
#sound svg{display:block}
.place .eyebrow,#seats{display:none!important}
#vol{width:120px;accent-color:var(--brick-hi)}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--paper-dim)}
.place h1{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.3;margin:0;text-wrap:balance}
.seats{font-size:12px;color:var(--paper-dim);margin:0}
#sound,#time{pointer-events:auto;flex:none;font-family:var(--body);font-size:14px;color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer}
#sound[aria-pressed="true"]{background:var(--paper);color:var(--on-paper);border-color:transparent}

#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:40px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--shade),transparent);pointer-events:none}
#hint{font-size:14px;line-height:1.5;color:var(--paper-dim);text-align:center;max-width:34ch;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;pointer-events:auto}
.btn{font-family:var(--body);font-size:16px;min-height:46px;padding:11px 20px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--paper);cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn.primary{background:var(--paper);color:var(--on-paper);border-color:transparent}
.btn:focus-visible,#sound:focus-visible,#time:focus-visible,.item:focus-visible{outline:2px solid var(--brick-hi);outline-offset:2px}
.btn:active{transform:scale(.97)}

.bubble{position:fixed;left:0;top:0;z-index:4;transform:translate(-50%,-100%);background:var(--paper);color:var(--on-paper);font-size:15px;line-height:1.35;padding:8px 13px;border-radius:14px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s}
.bubble.show{opacity:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.bubble.me{background:var(--brick);color:var(--paper)}
.bubble.me::after{border-top-color:var(--brick)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:6;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--panel-solid);border:1px solid var(--line);color:var(--paper);font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#toast.show{opacity:1}

#dishCard{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);z-index:6;width:min(380px,calc(100% - 32px));display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center;padding:12px;background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#dishCard[hidden]{display:none}
#dishCanvas{width:132px;height:106px;display:block;border-radius:10px;background:var(--dc-bg)}
.dc-text{min-width:0}
.dc-eyebrow{font-size:11px;letter-spacing:.18em;color:var(--paper-dim);margin-right:52px}
#dishCard h3{font-family:var(--display);font-weight:400;font-size:22px;margin:2px 0 4px}
#dishCard p{margin:0;font-size:13px;line-height:1.55;color:var(--paper-dim);white-space:pre-line;max-height:9.4em;overflow-y:auto;touch-action:pan-y}
.dc-nav{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--paper-dim)}
.dc-nav[hidden]{display:none}
.dc-nav button,#dcClose{font-family:var(--body);background:none;border:1px solid var(--line);color:var(--paper);border-radius:999px;min-width:32px;min-height:32px;cursor:pointer}
#dcClose{position:absolute;top:8px;right:8px;font-size:12px;padding:0 10px}
.item.on{background:rgba(224,122,82,.14)}
.item.on .go{color:var(--paper)}
.btn[disabled]{opacity:.45;cursor:default}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;pointer-events:none}
#sheet[hidden]{display:none!important}
.sheet-inner{pointer-events:auto;width:100%;max-width:480px;background:var(--panel-solid);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding-top:20px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:up .28s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--brick)}
.sheet-head h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.04em}
.sheet-head p{margin:0;font-size:13px;color:var(--paper-dim)}
.list{display:flex;flex-direction:column;max-height:min(56vh,520px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--paper);padding:14px 2px;cursor:pointer;font-family:var(--body)}
.item .nm{font-family:var(--display);font-size:23px;line-height:1.2}
.item .hj{display:block;font-size:13px;color:var(--paper-dim);letter-spacing:.18em;margin-top:2px}
.item .go{font-size:14px;color:var(--brick-hi)}
.sheet-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.sansho{padding:18px 0 4px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.sansho p{margin:0;font-size:14px;line-height:1.55;color:var(--paper-dim);max-width:30ch}
.count{font-family:var(--display);font-size:30px}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--paper-dim)}
.dots i.on{background:#7b8a3a;border-color:#a7b866}
.tok{width:96px;height:96px;border-radius:50%;font-family:var(--display);font-size:28px;background:var(--brick);color:var(--paper);border:0;cursor:pointer}
.tok:active{transform:scale(.94)}

#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:var(--display);font-size:20px;color:var(--paper-dim);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.sheet-inner{animation:none}.bubble,#toast,#loading{transition:none}}

</style>
</head>

<div id="stage"></div>

<div id="top">

  const rs=[RECTS.street,RECTS.shop,RECTS.door,BK_RECTS.room,BK_RECTS.door,BACK,GARDEN].concat(TP_RECTS,ramen&&ramen.open?RM_RECTS:[],ALLEYS,bo?[BF_RECTS.room,BF_RECTS.door]:[]);
  if(rs.some(r=>inR(r,x,z)))best=[x,z];else{let bd=1e9;
  for(const r of rs){const c=clampR(r,x,z);const d=(c[0]-x)**2+(c[1]-z)**2;if(d<bd){bd=d;best=c;}}}
  if(best[1]>4.5)best[1]=Math.min(best[1],shoreZ(best[0])-.7);if(zoneOf(best[0],best[1])==='books')best=pushSp(best,BK_RECTS.room);return best;}
const ROOMS={mapo:{x0:-3,x1:3,z0:-10.1,z1:-2.05},bfast:{x0:-11,x1:-7,z0:-7.3,z1:-2.05},books:{x0:-19.0,x1:-12.5,z0:-10.1,z1:-2.05},tempura:{x0:15,x1:25,z0:-7.1,z1:-2.05},ramen:{x0:6,x1:12,z0:-10.1,z1:-2.05}};
const zoneOf=(x,z)=>{for(const k in ROOMS)if(inR(ROOMS[k],x,z))return k;return'out';};
const isInside=(z,x)=>zoneOf(x==null?P.pos.x:x,z)!=='out';
const BKX=books?books.g.position.x:-15.75;
const TPX=tempura?tempura.g.position.x:20;
const RMX=ramen?ramen.g.position.x:9;
const DOORX={mapo:0,bfast:-10.1,books:BKX-1.94,tempura:TPX-.3,ramen:RMX};
const RM_RECTS=[{x0:RMX-2.6,x1:RMX+2.2,z0:-2.75,z1:-2.3},{x0:RMX+1.4,x1:RMX+2.2,z0:-9.2,z1:-2.3},{x0:RMX-.6,x1:RMX+.6,z0:-2.7,z1:-.8}];
const ALLEYS=[[-20.8,-19.3],[-12.3,-11.2],[-6.7,-3.3],[3.3,5.7],[12.3,14.7],[25.3,26.4]].map(([x0,x1])=>({x0,x1,z0:-10.5,z1:-.9,cx:(x0+x1)/2}));
const BACK={x0:-20.8,x1:26.4,z0:-11.3,z1:-10.4};
const BK_RECTS={room:{x0:BKX-2.0,x1:BKX+2.85,z0:-9.4,z1:-2.45},door:{x0:BKX-2.35,x1:BKX-1.55,z0:-2.7,z1:-.8}};
const LOT={x0:6.3,x1:11.7,z0:-8.6,z1:-1};
const TP_RECTS=[{x0:TPX-4.7,x1:TPX+4.75,z0:-3.0,z1:-2.35},{x0:TPX+4.2,x1:TPX+4.78,z0:-6.0,z1:-2.35},{x0:TPX-.75,x1:TPX+.15,z0:-2.7,z1:-.8}];
const GARDEN={x0:TPX-4.7,x1:TPX+4.7,z0:-11.3,z1:-7.35};
/* the bookshop's first floor, and the spiral staircase in its back right corner */
const UP_RECTS=[{x0:BKX-3.0,x1:BKX+2.95,z0:-9.6,z1:-3.05}];
const SPC=()=>[BKX+2.05,-8.75],SP_SPAN=5.34,SP_A0=Math.PI/2;
function spPt(p,r){const c=SPC(),a=SP_A0-p;return[c[0]+Math.cos(a)*r,c[1]+Math.sin(a)*r];}
function spProg(x,z){const c=SPC();let p=SP_A0-Math.atan2(z-c[1],x-c[0]);p=((p%(2*Math.PI))+2*Math.PI)%(2*Math.PI);if(p>SP_SPAN)p=p>(SP_SPAN+2*Math.PI)/2?0:SP_SPAN;return p;}
const spR=(x,z)=>{const c=SPC();return Math.hypot(x-c[0],z-c[1]);};
const inStair=(x,z)=>spR(x,z)<.98&&zoneOf(x,z)==='books';
function pushSp(b,rect){const c=SPC();let dx=b[0]-c[0],dz=b[1]-c[1],d=Math.hypot(dx,dz);if(d>=1.3)return b;
  if(d<1e-3){dx=-1;dz=1;d=Math.SQRT2;}let q=clampR(rect,c[0]+dx/d*1.3,c[1]+dz/d*1.3);
  if(spR(q[0],q[1])<1.3){const m=[BKX,-5.5],ex=m[0]-c[0],ez=m[1]-c[1],e=Math.hypot(ex,ez);q=[c[0]+ex/e*1.3,c[1]+ez/e*1.3];}return q;}
function legalUp(x,z){let best=null,bd=1e9;for(const r of UP_RECTS){if(inR(r,x,z)){best=[x,z];break;}const c=clampR(r,x,z),d=(c[0]-x)**2+(c[1]-z)**2;if(d<bd){bd=d;best=c;}}return pushSp(best,UP_RECTS[0]);}
function planUp(fx,fz,tx,tz){return[[tx,tz]];}
function helix(pa,pb,lv){const n=Math.max(1,Math.ceil(Math.abs(pb-pa)/.5)),out=[];for(let k=0;k<=n;k++){const q=spPt(pa+(pb-pa)*k/n,.55);if(k===n)q.push(lv);q.h=1;out.push(q);}return out;}
const SP_IN=()=>spPt(0,1.15),SP_OUT=()=>spPt(SP_SPAN,1.15);
// walking across the room: step round the staircase instead of through it
function detour(path,fx,fz){const out=[],c=SPC();let px=fx,pz=fz;
  const inPass=(x,z)=>x>TPX+4.05&&z<-3.1,inHall=(x,z)=>x>RMX+1.3&&z<-2.85;
  for(const w of path){if(zoneOf(w[0],w[1])==='ramen'&&zoneOf(px,pz)==='ramen'&&inHall(px,pz)!==inHall(w[0],w[1]))out.push([RMX+1.75,-2.5]);
    if(zoneOf(w[0],w[1])==='tempura'&&zoneOf(px,pz)==='tempura'&&inPass(px,pz)!==inPass(w[0],w[1]))out.push([TPX+4.45,-2.7]);
    if(!w.h&&zoneOf(w[0],w[1])==='books'&&zoneOf(px,pz)==='books'&&spR(px,pz)>1.2&&spR(w[0],w[1])>1.2){
      const vx=w[0]-px,vz=w[1]-pz,L2=vx*vx+vz*vz;if(L2>1e-6){const s=Math.max(0,Math.min(1,((c[0]-px)*vx+(c[1]-pz)*vz)/L2)),qx=px+vx*s,qz=pz+vz*s,d=Math.hypot(qx-c[0],qz-c[1]);
        if(d<1.1&&s>0&&s<1){let ux=qx-c[0],uz=qz-c[1];if(d<1e-3){ux=-vz;uz=vx;}const u=Math.hypot(ux,uz);out.push([c[0]+ux/u*1.35,c[1]+uz/u*1.35]);}}}
    out.push(w);px=w[0];pz=w[1];}return out;}
function floorY(x,z,lv){if(inStair(x,z))return 3.5*spProg(x,z)/SP_SPAN;if(lv===1)return 3.5;return z>4.9?sandY(x,z):0;}
function regionOf(x,z){const zn=zoneOf(x,z);if(zn!=='out')return zn;if(inR(BACK,x,z)||inR(GARDEN,x,z))return'back';for(let i=0;i<ALLEYS.length;i++)if(inR(ALLEYS[i],x,z))return'a'+i;return'street';}
const nearAlley=x=>ALLEYS.reduce((b,a)=>Math.abs(a.cx-x)<Math.abs(b.cx-x)?a:b);
function exitsTo(reg,x){if(DOORX[reg]!=null)return[[DOORX[reg],reg==='books'?-2.6:reg==='ramen'?-2.5:-3.0],[DOORX[reg],-.6]];if(reg[0]==='a'&&reg!=='a')return[[ALLEYS[+reg.slice(1)].cx,-.6]];
  if(reg==='back'){const a=nearAlley(x);return[[a.cx,-10.85],[a.cx,-.6]];}return[];}
function plan(fx,fz,tx,tz){const ra=regionOf(fx,fz),rb=regionOf(tx,tz);if(ra===rb)return[[tx,tz]];
  if(ra[0]==='a'&&rb==='back'){const a=ALLEYS[+ra.slice(1)];return[[a.cx,-10.85],[tx,tz]];}
  if(ra==='back'&&rb[0]==='a'){const a=ALLEYS[+rb.slice(1)];return[[a.cx,-10.85],[tx,tz]];}
  if(ra==='back'&&rb!=='street'){const a=nearAlley(tx);return[[a.cx,-10.85],[a.cx,-.6]].concat(exitsTo(rb,tx).reverse(),[[tx,tz]]);}
  return exitsTo(ra,fx).concat(rb==='back'?(()=>{const a=nearAlley(fx);return[[a.cx,-.6],[a.cx,-10.85]];})():exitsTo(rb,tx).reverse(),[[tx,tz]]);}
const BF_RECTS={room:{x0:-10.75,x1:-9.6,z0:-6.7,z1:-2.45},door:{x0:-10.55,x1:-9.65,z0:-2.7,z1:-0.8}};
function spotOf(seat){return seat.kind==='tstool'?TSEATS[seat.i]:seat.kind==='chair'?books.CHAIRS[seat.i]:seat.kind==='window2'?books.WIN2[seat.i]:seat.kind==='patio'?PATIO[seat.i]:seat.kind==='stand'?STANDS[seat.i]:SEATS[seat.i];}
function walkTo(x,z,onArrive,lvl){if(P.seat)standUp();if(S.dialog){S.dialog=null;render();}lvl=lvl||0;const[tx,tz]=legal(x,z,lvl);
  let fx=P.pos.x,fz=P.pos.z,cur=P.level,path=[];

  else if(cur!==lvl){const e=lvl?SP_IN():SP_OUT();path=(lvl?plan(fx,fz,e[0],e[1]):planUp(fx,fz,e[0],e[1])).concat(lvl?helix(0,SP_SPAN,1):helix(SP_SPAN,0,0),[lvl?SP_OUT():SP_IN()]);}

  P.onArrive=onArrive||null;marker.position.x=tx;marker.position.z=tz;marker.position.y=lvl?3.53:.02;markerT=1;NET.move();}

/* ---------- seating + ordering ---------- */
const S={phase:'idle',timers:[],dish:null,cooking:false,lastInside:false};
function later(fn,ms){S.timers.push(setTimeout(fn,ms));}
function clearTimers(){S.timers.forEach(clearTimeout);S.timers=[];talking=false;S.busy=false;}
function nearestStool(){let bi=0,bd=1e9;SEATS.forEach((s,i)=>{if(NET.seatTaken('stool',i))return;const d=Math.hypot(s.x-P.pos.x,s.z-P.pos.z);if(d<bd){bd=d;bi=i;}});return bi;}
const approachX=s=>s.side==='L'?.3:1.35;
function goSit(i){if(NET.seatTaken('stool',i)){toast('누군가 앉아 있는 자리예요.');return;}const s=SEATS[i];walkTo(approachX(s),s.z,()=>sit({kind:'stool',i}));}
function sit(seat){P.path=[];P.seat=seat;
  if(seat.kind==='stool'){const st=SEATS[seat.i];P.pos.set(st.x,.32,st.z);P.yawT=st.side==='L'?-Math.PI/2:Math.PI/2;S.phase='idle';say('owner',st.side==='L'?'어서 오세요. 편하게 계세요.':'창가 자리 좋죠. 편하게 계세요.',2600);}
  else if(seat.kind==='stand'){const ps=STANDS[seat.i];P.pos.set(ps.x,0,ps.z);P.yawT=ps.yaw;S.phase='idle';say('bowner','어서 오세요! 서서 편하게 드시고 가세요.',2400);}
  else if(seat.kind==='patio'){const ps=PATIO[seat.i];P.pos.set(ps.x,ps.y==null?.13:ps.y,ps.z);P.yawT=ps.yaw;S.phase='idle';say('bowner','어서 오세요! 편하게 앉으세요.',2400);}
  else if(seat.kind==='chair'||seat.kind==='tstool'){if(S.takeout)S.phase='have';const c=spotOf(seat);P.pos.set(c.x,c.y,c.z);P.yawT=c.yaw;if(seat.kind==='tstool'){if(!S.takeout)S.phase='idle';say(chefKey(c.shop),'어서 오세요! 편하게 앉으세요.',2200);}}
  else if(seat.kind==='window2'){if(S.takeout)S.phase='have';const w=books.WIN2[seat.i];P.pos.set(w.x,w.y,w.z);P.yawT=0;cam.tilt=0;cam.yawT=cam.yaw+((((Math.PI-cam.yaw)%(Math.PI*2))+Math.PI*3)%(Math.PI*2)-Math.PI);}
  else{if(S.takeout)S.phase='have';{const bs=seat.kind==='sand'?{x:seat.x,z:seat.z,y:sandY(seat.x,seat.z)-.36}:BENCH_SPOTS[seat.i];P.pos.set(bs.x,bs.y,bs.z);}P.yawT=seat.kind==='bench'?(BENCH_SPOTS[seat.i].yaw||0):0;cam.tilt=0;cam.yawT=cam.yaw+((((Math.PI-cam.yaw)%(Math.PI*2))+Math.PI*3)%(Math.PI*2)-Math.PI);}
  P.hipL.rotation.x=P.hipR.rotation.x=seat.kind==='stand'?0:-1.4;if(seat.kind!=='stand')setBagDown(true);render();NET.state();}

  if(seat.kind==='stool'){P.pos.x=approachX(SEATS[seat.i]);removeDish();stopCooking();if(S.phase!=='idle'&&S.phase!=='done')say('owner','다음에 또 들러요.',2000);}

/* a meal is one or two dishes set side by side in front of the seat */

/* menu with up to two choices */

  draw();
  ui.sheetBody.onclick=e=>{const t=e.target.closest('button');if(!t||t.disabled)return;
    if(t.hasAttribute('data-pclose')){closeSheet();return;}
    if(t.hasAttribute('data-porder')){done(sel.slice());return;}

function makeBreakfast(id){const g=new THREE.Group(),food=new THREE.Group();g.add(food);const cream=PH(0xf4f1ea,60);

  dusk:{label:'노을',sky:['#2f3a66','#a8687e','#f2a46e'],fogN:20,fogF:90,hemi:[0xffc8a8,0x4a3a40,.7],sun:[0xffa070,.55],sunPos:[-25,8,30],lamps:.9,shopL:1.25,water:{shallow:'#7a9aa6',mid:'#4f7290',deep:'#3a5578',far:'#e8a482'},spark:.35,foam:.8,moon:[.7,.3],stars:.35,meteors:.4},
  night:{label:'밤',sky:['#121733','#2f2849','#4a3a58'],fogN:20,fogF:80,hemi:[0x8a98c8,0x2e2222,.6],sun:[0xb0bcff,.42],sunPos:[-12,22,16],lamps:1.3,shopL:1.35,water:{shallow:'#2c4a5a',mid:'#20364e',deep:'#1a2a44',far:'#4a3a58'},spark:0,foam:.45,moon:[1,1],stars:1,meteors:1}};
const timeBtn=$('#time');let curPreset='',timeMode='auto';
function applyPreset(name){const p=PRESETS[name];curPreset=name;palette=p;paintSky(p.sky);scene.fog.near=p.fogN;scene.fog.far=p.fogF;
  hemi.color.setHex(p.hemi[0]);hemi.groundColor.setHex(p.hemi[1]);hemi.intensity=p.hemi[2];sun.color.setHex(p.sun[0]);sun.intensity=p.sun[1];sun.position.set(...p.sunPos);
  lampLights.forEach(l=>l.intensity=p.lamps);lampBulbs.forEach(b=>b.material.color.setHex(p.lamps>0?0xffd59a:0xbab5ab));
  shopLights.forEach(l=>l.intensity=p.shopL);doorGlow.intensity=p.shopL*.8;paintWater(p.water);moonMat.opacity=p.moon[0];roadMat.opacity=p.moon[1];starBase=p.stars;meteorBase=p.meteors;}
// rough location from the viewer's time zone (Korea → the Gangwon coast)
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(e){return'';}})();
const GEO={'Asia/Seoul':[37.75,128.9],'Asia/Tokyo':[35.7,139.7],'Asia/Shanghai':[31.2,121.5],'Asia/Taipei':[25,121.5],'Asia/Hong_Kong':[22.3,114.2],'Asia/Singapore':[1.3,103.8],'Europe/London':[51.5,-.1],'Europe/Paris':[48.9,2.35],'Europe/Berlin':[52.5,13.4],'America/New_York':[40.7,-74],'America/Chicago':[41.9,-87.6],'America/Denver':[39.7,-105],'America/Los_Angeles':[34.05,-118.2],'Australia/Sydney':[-33.9,151.2]};
function sunTimes(d){const[lat,lon]=GEO[TZ]||[37.5,-d.getTimezoneOffset()/4],rad=Math.PI/180;
  const doy=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/864e5),g=2*Math.PI/365*(doy-1);
  const eq=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
  const dec=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
  const c=Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(dec))-Math.tan(lat*rad)*Math.tan(dec);
  if(c>1||c<-1)return{rise:390,set:1080};
  const ha=Math.acos(c)/rad,noon=720-4*lon-eq,off=-d.getTimezoneOffset(),w=m=>((m+off)%1440+1440)%1440;
  return{rise:w(noon-4*ha),set:w(noon+4*ha)};}
const hhmm=m=>{m=Math.round(m);return`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;};
function autoPreset(){const d=new Date(),st=sunTimes(d),m=d.getHours()*60+d.getMinutes();
  if(m>=st.rise-45&&m<st.rise+30)return'dawn';if(m>=st.rise+30&&m<st.set-40)return'day';if(m>=st.set-40&&m<st.set+35)return'dusk';return'night';}
function refreshTime(){setTimeout(updateBreakfast,0);const name=timeMode==='auto'?autoPreset():timeMode;if(name!==curPreset)applyPreset(name);
  timeBtn.textContent='시간 · '+(timeMode==='auto'?'자동 · ':'')+PRESETS[name].label;}
timeBtn.addEventListener('click',()=>{const M=['auto','dawn','day','dusk','night'];timeMode=M[(M.indexOf(timeMode)+1)%M.length];refreshTime();
  if(timeMode==='auto'){const st=sunTimes(new Date());toast(`해 뜨는 ${hhmm(st.rise)}, 해 지는 ${hhmm(st.set)}에 맞춰 바뀌어요.`);}});
refreshTime();setInterval(()=>{if(timeMode==='auto')refreshTime();updateBreakfast();},60000);

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);

function onTap(cx,cy){ensureAudio();ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);

    if(r.carryObj){if(r.carryObj.cup)r.c.armR.fore.remove(r.carryObj.cup);if(r.carryObj.bag&&r.carryObj.bag.parent)r.carryObj.bag.parent.remove(r.carryObj.bag);r.carryObj=null;}
    if(on){const cup=new THREE.Group();cup.position.set(0,-.24,.03);cup.rotation.x=Math.PI/2;r.c.armR.fore.add(cup);
      cyl(.05,.04,.14,L(0xf4f1ea),0,0,0,cup,14);cyl(.052,.046,.06,L(0x9a6a3e),0,-.005,0,cup,14);cyl(.055,.055,.02,L(0x2b2b2b),0,.08,0,cup,14);
      const bag=new THREE.Group();bag.position.set(0,-.33,.02);r.c.armL.fore.add(bag);
      box(.17,.22,.1,L(0xb88d5c),0,0,0,bag);r.carryObj={cup,bag};if(!on.includes('c')){r.c.armR.fore.remove(cup);r.carryObj.cup=null;}if(!on.includes('b')){r.c.armL.fore.remove(bag);r.carryObj.bag=null;}}placeBag(r);}
  function placeBag(r){const b=r.carryObj&&r.carryObj.bag;if(!b)return;const sp=r.seat&&r.seat.kind!=='stand'?seatPose(r.seat):null;if(b.parent)b.parent.remove(b);
    if(sp){const bx=sp.x+Math.cos(sp.yaw)*.38,bz=sp.z-Math.sin(sp.yaw)*.38;b.position.set(bx,bagY(r.seat.kind,sp.y,bx,bz),bz);b.rotation.set(0,sp.yaw,0);scene.add(b);}
    else{b.position.set(0,-.33,.02);b.rotation.set(0,0,0);r.c.armL.fore.add(b);}}
  function setDish(r,dish,seat){const key=dish&&seat?JSON.stringify([dish,seat.kind,seat.i]):null;if(key===r.dish)return;
    if(r.dishObj){scene.remove(r.dishObj.g);r.dishObj=null;}r.dish=key;if(!key)return;
    const base=dish==='empty'?r.lastDish:dish;if(!base)return;r.lastDish=base;
    const ids=String(base).split('+').filter(Boolean),kind=seat.kind==='patio'||seat.kind==='stand'||seat.kind==='tstool'?seat.kind:'stool',st=spotOf(seat);if(!st||!ids.length)return;
    const m=makeMeal(ids,kind);layoutMeal(m,kind,st);if(dish==='empty')m.parts.forEach(p=>p.g.remove(p.food));m.g.userData.steam.forEach(s=>s.visible=false);scene.add(m.g);r.dishObj=m;}
  function applySeat(r,seat){const same=JSON.stringify(seat||null)===JSON.stringify(r.seat||null);if(same)return;
    if(r.seat&&!seat){const sp=seatPose(r.seat);if(sp){r.c.g.position.set(sp.ax,0,sp.az);}r.c.hipL.rotation.x=r.c.hipR.rotation.x=0;}
    r.seat=seat||null;
    if(seat)r.lv=seat.kind==='window2'||(seat.kind==='chair'&&books&&books.CHAIRS[seat.i]&&books.CHAIRS[seat.i].lv)?1:(seat.kind==='chair'?0:r.lv);
    if(seat){const sp=seatPose(seat);if(sp){r.path=[];r.c.g.position.set(sp.x,sp.y,sp.z);r.c.yaw=sp.yaw;r.c.hipL.rotation.x=r.c.hipR.rotation.x=sp.stand?0:-1.4;}}}
  function applyPresence(d){if(!d||d.id===myId)return;
    let r=remotes.get(d.id);const isNew=!r;if(!r)r=addRemote(d.id,d);
    r.nick=d.nick;applySeat(r,d.seat);setCarry(r,d.carry);placeBag(r);setDish(r,d.dish,d.seat);if(!r.path.length)r.lv=d.lv||0;
    if(!r.seat&&!r.path.length){const p=r.c.g.position,gap=Math.hypot(p.x-d.x,p.z-d.z);
      if(isNew||gap>6)p.set(d.x,0,d.z);else if(gap>.4)r.path=[[d.x,d.z]];}}
  function onMove(m){const r=remotes.get(m.id);if(!r||!Array.isArray(m.path))return;
    if(r.seat)applySeat(r,null);
    const p=r.c.g.position;if(Math.hypot(p.x-m.from[0],p.z-m.from[1])>1.5)p.set(m.from[0],0,m.from[1]);
    r.path=m.path.slice(0,16).map(q=>q.length>2?[+q[0],+q[1],+q[2]]:[+q[0],+q[1]]);}

  NET.update=(dt,t)=>{for(const r of remotes.values()){const c=r.c,p=c.g.position;let walking=false;
    if(r.path.length&&!r.seat){const[tx,tz]=r.path[0],dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);
      if(d<.04){const wp=r.path.shift();if(wp[2]!=null)r.lv=wp[2];}else{const s=Math.min(d,2.7*dt);p.x+=dx/d*s;p.z+=dz/d*s;c.yaw=Math.atan2(dx,dz);walking=true;}}
    c.g.rotation.y=angLerp(c.g.rotation.y,c.yaw,Math.min(1,dt*10));
    if(!r.seat)p.y=floorY(p.x,p.z,r.lv);
    if(walking){c.phase+=dt*10;const k=Math.sin(c.phase);c.hipL.rotation.x=k*.6;c.hipR.rotation.x=-k*.6;c.armL.rotation.x=-k*.5;c.armR.rotation.x=k*.5;c.head.position.y=1.4+Math.abs(Math.cos(c.phase))*.04;}
    else if(!r.seat){c.hipL.rotation.x*=.8;c.hipR.rotation.x*=.8;c.armL.rotation.x*=.8;c.armR.rotation.x*=.8;c.head.position.y=1.4+Math.sin(t*2+r.id.length)*.008;}
    else{c.armL.rotation.x=c.armR.rotation.x=-.35;}
    if(r.carry&&r.carry.includes('c')){c.armR.fore.rotation.x=-Math.PI/2;c.armR.rotation.x=r.seat?-.1:0;}else c.armR.fore.rotation.x=0;
    c.shadow.visible=!r.seat;}};

  /* ---- channel, with overflow into the next room when one is full ---- */
  function showCount(){if(!joined){return;}peopleEl.hidden=false;peopleEl.textContent=`지금 골목에 ${remotes.size+1}명`;}
  function join(idx){roomIdx=idx;decided=false;leaving=false;
    const name=idx?`${BASE}-${idx+1}`:BASE;
    ch=client.channel(name,{config:{presence:{key:myId},broadcast:{self:false}}});
    ch.on('presence',{event:'sync'},()=>{const st=ch.presenceState(),ids=new Set();
        for(const k in st){const arr=st[k];const d=arr&&arr[arr.length-1];if(!d)continue;ids.add(d.id||k);applyPresence(d);}
        for(const id of [...remotes.keys()])if(!ids.has(id))dropRemote(id);
        if(!decided&&ids.has(myId)){decided=true;if(ids.size>MAX){moveRoom(idx+1);return;}}
        showCount();})
      .on('broadcast',{event:'move'},({payload})=>{if(payload)onMove(payload);})
      .subscribe((st,err)=>{const status0=st;
        if(st!=='SUBSCRIBED')status(st==='TIMED_OUT'?'연결이 늦어지고 있어요 · 다시 시도 중':'연결이 끊겼어요 · 다시 시도 중'+(err&&err.message?' ('+String(err.message).slice(0,60)+')':''));
        if(status0==='SUBSCRIBED'){joined=true;try{ch.track(me());}catch(e){}showCount();}
        else if((status0==='CHANNEL_ERROR'||status0==='TIMED_OUT'||status0==='CLOSED')&&!leaving){joined=false;showCount();
          const old=ch;leaving=true;setTimeout(()=>{try{client.removeChannel(old);}catch(e){}join(roomIdx);},4000);}});}
  function moveRoom(next){const old=ch;joined=false;leaving=true;for(const id of [...remotes.keys()])dropRemote(id);
    try{old.untrack();}catch(e){}try{client.removeChannel(old);}catch(e){}join(next);}
  join(0);
})();

})();
</script>
